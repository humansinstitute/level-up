<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minotaur Maze</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#171326;color:#f8edcf;font:700 16px system-ui;touch-action:manipulation;user-select:none;-webkit-user-select:none}main{position:relative;width:min(94vw,442px);text-align:center}h1{margin:.4rem 0;font-size:clamp(1.5rem,8vw,2rem)}canvas{display:block;width:100%;aspect-ratio:1;border:6px solid #d7f64a;background:#302747;image-rendering:pixelated;touch-action:pan-y}p{margin:10px}.pad{display:grid;grid-template-columns:repeat(3,56px);justify-content:center;gap:5px}.pad button{min-width:44px;min-height:44px;padding:14px;border:0;background:#ff8a3d;font-weight:900}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}.overlay{position:absolute;inset:3.2rem 6px auto;min-height:min(74vw,330px);display:grid;place-content:center;gap:12px;padding:24px;background:#171326ef;border:3px solid #d7f64a}.overlay[hidden]{display:none}.overlay h2,.overlay p{margin:0}.overlay p{line-height:1.45}.overlay button{min-height:52px;padding:12px 20px;border:0;background:#ff8a3d;color:#171713;font-weight:900}</style></head><body><main><h1>MINOTAUR MAZE</h1><canvas width="420" height="420" aria-label="Minotaur Maze game"></canvas><section class="overlay" id="start"><h2>ESCAPE THE MAZE</h2><p id="controls"></p><button type="button">START GAME</button></section><p id="s" aria-live="polite">Reach the gold gate. Avoid the red hunter.</p><div class="pad" aria-label="Direction controls"><button data-d="0,-1" aria-label="Up">▲</button><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div></main><script>// Adapted into Level Up from source game: minotaurgame.
const c=document.querySelector('canvas'),x=c.getContext('2d'),s=document.querySelector('#s'),startOverlay=document.querySelector('#start'),controls=document.querySelector('#controls'),N=10,w=42,walls=new Set(['1,0','1,1','1,2','3,1','4,1','5,1','3,3','3,4','3,5','5,3','6,3','7,3','7,4','7,5','1,6','2,6','3,6','5,7','6,7','7,7','8,7']);let p=[0,0],m=[9,0],over=false,running=false,inputMode=matchMedia('(hover:hover) and (pointer:fine)').matches?'keyboard':'touch';function legend(){controls.textContent=inputMode==='touch'?'Swipe the maze to move. Tap Start to begin.':'Arrow keys or WASD move. Enter starts; R restarts.'}legend();function reset(){p=[0,0];m=[9,0];over=false;running=true;s.textContent='Reach the gold gate. Avoid the red hunter.';startOverlay.hidden=true;draw()}function draw(){x.fillStyle='#302747';x.fillRect(0,0,420,420);for(const q of walls){let[a,b]=q.split(',').map(Number);x.fillStyle='#d7f64a';x.fillRect(a*w,b*w,w-2,w-2)}x.fillStyle='#ffd43b';x.fillRect(9*w+8,9*w+8,26,26);x.fillStyle='#69d6ef';x.fillRect(p[0]*w+7,p[1]*w+7,28,28);x.fillStyle='#ef4b45';x.fillRect(m[0]*w+7,m[1]*w+7,28,28)}function move(dx,dy){if(!running||over)return;let n=[p[0]+dx,p[1]+dy];if(n.some(v=>v<0||v>=N)||walls.has(n.join(',')))return;p=n;let opts=[[Math.sign(p[0]-m[0]),0],[0,Math.sign(p[1]-m[1])]].filter(([a,b])=>a||b).map(([a,b])=>[m[0]+a,m[1]+b]).filter(q=>!walls.has(q.join(',')));if(opts.length)m=opts[Math.random()*opts.length|0];if(p[0]===9&&p[1]===9){s.textContent='YOU ESCAPED! Press R or tap a direction to restart.';over=true}if(p+''===m+''){s.textContent='THE MINOTAUR FOUND YOU — press R or tap a direction';over=true}draw()}function act(dx,dy){if(over){reset();return}move(dx,dy)}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>act(...b.dataset.d.split(',').map(Number)));startOverlay.querySelector('button').onclick=reset;addEventListener('keydown',e=>{inputMode='keyboard';legend();let d={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];if(d){e.preventDefault();act(...d)}else if(e.key==='Enter'&&!running)reset();else if(e.key==='r'||e.key==='R')reset()});let gesture=null;c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;inputMode='touch';legend();gesture={id:e.pointerId,x:e.clientX,y:e.clientY};c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(gesture&&e.pointerId===gesture.id)e.preventDefault()},{passive:false});c.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;act(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]))});c.addEventListener('pointercancel',()=>gesture=null);draw();</script></body></html>

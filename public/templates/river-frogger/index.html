<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>River Hop</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#172322;color:#f8edcf;font:700 16px system-ui;touch-action:manipulation;user-select:none;-webkit-user-select:none}main{position:relative;width:min(94vw,430px);text-align:center}h1{margin:.4rem 0;font-size:clamp(1.5rem,8vw,2rem)}canvas{display:block;width:100%;height:min(110vw,520px);max-height:62dvh;border:5px solid #d7f64a;image-rendering:pixelated;touch-action:pan-y}.pad{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:5px}.pad button{min-width:44px;min-height:44px;border:0;padding:14px;background:#d7f64a;font-weight:900}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}.overlay{position:absolute;inset:3.2rem 5px auto;min-height:min(94vw,410px);display:grid;place-content:center;gap:12px;padding:24px;background:#172322ef;border:3px solid #d7f64a}.overlay[hidden]{display:none}.overlay h2,.overlay p{margin:0}.overlay p{line-height:1.45}.overlay button{min-height:52px;padding:12px 20px;border:0;background:#d7f64a;color:#171713;font-weight:900}</style></head><body><main><h1>RIVER HOP</h1><canvas width="420" height="520" aria-label="River Hop game"></canvas><section class="overlay" id="start"><h2>CROSS THE ROAD</h2><p id="controls"></p><button type="button">START GAME</button></section><p id="s" aria-live="polite">Hop to the bright bank.</p><div class="pad" aria-label="Direction controls"><button data-d="0,-1" aria-label="Up">▲</button><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div></main><script>// Adapted into Level Up from source game: frogger.
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),startOverlay=document.querySelector('#start'),controls=document.querySelector('#controls');let p={x:190,y:470},cars=[],over=false,running=false,inputMode=matchMedia('(hover:hover) and (pointer:fine)').matches?'keyboard':'touch';for(let r=0;r<6;r++)for(let i=0;i<3;i++)cars.push({x:i*170+(r%2)*60,y:390-r*60,v:(r%2?1:-1)*(1.2+r*.22)});function legend(){controls.textContent=inputMode==='touch'?'Swipe the road to hop. Tap Start to begin.':'Arrow keys or WASD hop. Enter starts; R restarts.'}legend();function reset(){p={x:190,y:470};over=false;running=true;s.textContent='Hop to the bright bank.';startOverlay.hidden=true}function draw(){g.fillStyle='#24352c';g.fillRect(0,0,420,520);g.fillStyle='#315f9b';g.fillRect(0,0,420,155);g.fillStyle='#d7f64a';g.fillRect(0,0,420,18);g.fillStyle='#45453b';g.fillRect(0,160,420,360);g.fillStyle='#eee0bf';for(let y=190;y<510;y+=60)g.fillRect(0,y,420,3);for(const a of cars){g.fillStyle='#ff633f';g.fillRect(a.x,a.y,64,32)}g.fillStyle='#79e64a';g.fillRect(p.x,p.y,32,32)}function loop(){if(running&&!over){for(const a of cars){a.x+=a.v;if(a.x>430)a.x=-70;if(a.x<-70)a.x=430;if(p.x<a.x+64&&p.x+32>a.x&&p.y<a.y+32&&p.y+32>a.y){over=true;s.textContent='SPLAT! Press R or hop to try again.'}}if(p.y<25){over=true;s.textContent='BANK REACHED! Press R or hop to play again.'}}draw();requestAnimationFrame(loop)}function move(dx,dy){if(over){reset();return}if(!running)return;p.x=Math.max(0,Math.min(388,p.x+dx*38));p.y=Math.max(5,Math.min(480,p.y+dy*38))}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...b.dataset.d.split(',').map(Number)));startOverlay.querySelector('button').onclick=reset;addEventListener('keydown',e=>{inputMode='keyboard';legend();let d={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}else if(e.key==='Enter'&&!running)reset();else if(e.key==='r'||e.key==='R')reset()});let gesture=null;c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;inputMode='touch';legend();gesture={id:e.pointerId,x:e.clientX,y:e.clientY};c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(gesture&&e.pointerId===gesture.id)e.preventDefault()},{passive:false});c.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]))});c.addEventListener('pointercancel',()=>gesture=null);loop();</script></body></html>

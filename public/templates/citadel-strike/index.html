<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Citadel Strike</title><style>
:root{--ink:#171713;--paper:#f9f2dd;--lime:#d7f64a;--rose:#ef5e63;--sky:#87c8bf;--panel:#17172d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090914;color:var(--paper);font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}body{display:grid;place-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{position:relative;width:min(100vw,760px);height:100dvh;max-height:900px;display:grid;grid-template-rows:auto minmax(0,1fr);background:#121225;overflow:hidden}header{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:8px 12px;background:var(--panel);border-bottom:2px solid var(--sky);font:800 12px ui-monospace,monospace}header b{color:var(--lime);text-align:right}.message{grid-column:1/-1;color:var(--sky);font-weight:700;min-height:1.2em}.message.hit{color:var(--lime)}.message.danger{color:#ff9ca1}canvas{display:block;width:100%;height:100%;touch-action:none;background:#13132b}.touch-gamepad{display:none;position:absolute;z-index:2;inset:auto max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));align-items:end;justify-content:space-between;pointer-events:none}.analogue{width:clamp(108px,27vw,150px);aspect-ratio:1;border:2px solid rgba(135,200,191,.44);border-radius:50%;background:rgba(9,9,20,.25);box-shadow:inset 0 0 22px rgba(135,200,191,.12);pointer-events:auto;touch-action:none}.analogue-knob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(249,242,221,.55);background:rgba(135,200,191,.28);transform:translate(-50%,-50%)}.actions{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.game-action{min-width:56px;min-height:56px;border:2px solid rgba(249,242,221,.62);border-radius:50%;background:rgba(23,23,45,.55);color:#fff;font:900 18px ui-monospace,monospace;touch-action:none}.game-action.primary{width:clamp(76px,19vw,96px);height:clamp(76px,19vw,96px);border-color:rgba(239,94,99,.7);background:rgba(106,37,56,.58)}.game-action.active,.game-action:active{background:rgba(215,246,74,.72);color:var(--ink)}.analogue:focus-visible,.game-action:focus-visible,#start button:focus-visible{outline:3px solid var(--lime);outline-offset:3px}#start{position:absolute;inset:0;z-index:3;display:grid;place-content:center;gap:14px;padding:24px;background:linear-gradient(#0a0a18f2,#1b1630f7);text-align:center}#start[hidden]{display:none}h1{margin:0;color:var(--lime);font-size:clamp(36px,12vw,72px);line-height:.9;text-transform:uppercase;text-shadow:5px 5px #472a5d}#start p{max-width:36ch;margin:0 auto;line-height:1.45}#objective{font-weight:850;color:var(--paper)}#start button{min-height:54px;border:0;background:var(--lime);color:var(--ink);font-weight:950;font-size:18px;box-shadow:6px 6px #566300}#controls{color:var(--sky);font:700 12px ui-monospace,monospace}@media(pointer:coarse){.touch-gamepad{display:flex}}@media(pointer:fine){.touch-gamepad{display:none}}@media(pointer:coarse) and (max-height:500px){.touch-gamepad{bottom:max(6px,env(safe-area-inset-bottom))}.analogue{width:96px}.game-action.primary{width:72px;height:72px}.game-action{min-width:48px;min-height:48px}header{padding-block:5px;font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><span id="s">Armour 100 · Drones 6</span><b id="mission">GATE 0/3</b><span id="message" class="message">Find the first red sentry. Keep the crosshair on it and fire.</span></header><canvas id="c" width="640" height="640" aria-label="First-person view inside a neon fortress"></canvas><div class="touch-gamepad" aria-label="Touch game controls"><div class="analogue" style="position:relative" role="group" tabindex="0" aria-label="Move and turn analogue pad"><span class="analogue-knob" aria-hidden="true"></span></div><div class="actions"><button type="button" class="game-action secondary" data-action="secondary" aria-label="Secondary action, reserved">B</button><button type="button" class="game-action primary" data-action="primary" aria-label="Fire">◎</button></div></div><section id="start"><h1>Citadel<br>Strike</h1><p id="objective">Enter three fortress chambers and destroy all six drones. Red bolts mean an enemy is about to fire—move behind a wall.</p><p id="controls">W/S move · A/D or arrows turn · Space fires · B secondary</p><button type="button">START MISSION</button></section></main><script>
const canvas=document.querySelector('#c'),g=canvas.getContext('2d'),overlay=document.querySelector('#start'),statusEl=document.querySelector('#s'),mission=document.querySelector('#mission'),message=document.querySelector('#message'),legend=document.querySelector('#controls'),objective=document.querySelector('#objective');
const MAP=['################','#..............#','#..##......##..#','#..............#','#......##......#','#......##......#','#..............#','#..###....###..#','#..............#','#......##......#','#......##......#','#..............#','#..##......##..#','#..............#','#..............#','################'];
const SPAWNS=[[7.4,12.2],[10.8,12.5],[3,8.7],[12.2,8.2],[5,3.3],[12.5,3.3]],FOV=Math.PI/3,MAX_RAY=22;
let player,enemies,running=false,outcome='ready',health=100,last=0,shotFlash=0,damageFlash=0,hitMarker=0,feedbackUntil=0,touchStart=null,keys=new Set(),elapsed=0,shots=0,hits=0,secondaryActions=0;
const analogue={pointerId:null,x:0,y:0},analogueEl=document.querySelector('.analogue'),analogueKnob=document.querySelector('.analogue-knob'),actionPointers=new Map();
function cell(x,y){return MAP[Math.floor(y)]?.[Math.floor(x)]??'#'}function blocked(x,y){return cell(x,y)==='#'}function normalize(a){return Math.atan2(Math.sin(a),Math.cos(a))}
function rayDistance(angle,max=MAX_RAY){const step=.035,cs=Math.cos(angle),sn=Math.sin(angle);for(let d=0;d<max;d+=step)if(blocked(player.x+cs*d,player.y+sn*d))return d;return max}
function lineClear(x,y){const dx=x-player.x,dy=y-player.y,dist=Math.hypot(dx,dy),steps=Math.ceil(dist/.08);for(let i=2;i<steps;i++){const t=i/steps;if(blocked(player.x+dx*t,player.y+dy*t))return false}return true}
function reset(){player={x:8,y:14.2,yaw:-Math.PI/2};health=100;outcome='playing';shotFlash=damageFlash=hitMarker=elapsed=shots=hits=0;feedbackUntil=0;enemies=SPAWNS.map((p,i)=>({x:p[0],y:p[1],hp:2,alive:true,cooldown:2.2+i*.34,charge:0,phase:i}));setMessage('Find the first red sentry. Keep the crosshair on it and fire.');status();draw()}
function setMessage(text,tone=''){message.textContent=text;message.className='message'+(tone?' '+tone:'');feedbackUntil=elapsed+2.2}function status(){const left=enemies.filter(e=>e.alive).length;statusEl.textContent=`Armour ${Math.max(0,Math.ceil(health))} · Drones ${left}`;const cleared=left===0?3:left<=2?2:left<=4?1:0;mission.textContent=left===0?'CITADEL CLEAR':`GATE ${cleared}/3`}
function mode(touch){legend.textContent=touch?'Left pad or Swipe: move / turn · ◎ fires · B secondary':'W/S move · A/D or arrows turn · Space fires · B secondary'}function start(){reset();running=true;overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)}
function finish(win){running=false;outcome=win?'won':'lost';overlay.hidden=false;overlay.querySelector('h1').innerHTML=win?'Citadel<br>Clear':'Mission<br>Failed';objective.textContent=win?`All six drones destroyed with ${Math.max(0,Math.ceil(health))} armour remaining.`:'Your armour collapsed. Use walls as cover when a drone glows white.';overlay.querySelector('button').textContent='RESTART MISSION';mission.textContent=win?'VICTORY':'ARMOUR LOST';draw()}
function move(dist){const nx=player.x+Math.cos(player.yaw)*dist,ny=player.y+Math.sin(player.yaw)*dist,r=.2;if(!blocked(nx+r,player.y)&&!blocked(nx-r,player.y))player.x=nx;if(!blocked(player.x,ny+r)&&!blocked(player.x,ny-r))player.y=ny}
function aimedEnemy(){let best=null,bestAngle=.055;for(const e of enemies)if(e.alive&&lineClear(e.x,e.y)){const d=Math.hypot(e.x-player.x,e.y-player.y),a=Math.abs(normalize(Math.atan2(e.y-player.y,e.x-player.x)-player.yaw));if(d<12&&a<bestAngle){bestAngle=a;best=e}}return best}
function fire(){if(!running)return;shots++;shotFlash=.11;const target=aimedEnemy();if(!target){setMessage('MISS — centre the crosshair on a visible drone.');return}hits++;target.hp--;hitMarker=.22;if(target.hp<=0){target.alive=false;setMessage('DRONE DOWN — advance to the next chamber.','hit')}else setMessage('HIT — armour cracked. One more shot.','hit');status();if(!enemies.some(e=>e.alive))finish(true)}
function primaryAction(){fire()}function secondaryAction(source='touch'){secondaryActions++;dispatchEvent(new CustomEvent('game:secondary-action',{detail:{source,count:secondaryActions}}))}
function update(dt){elapsed+=dt;const speed=2.35,turn=1.65,forward=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0)-analogue.y,turnInput=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+analogue.x;if(forward)move(speed*Math.max(-1,Math.min(1,forward))*dt);if(turnInput)player.yaw+=turn*Math.max(-1,Math.min(1,turnInput))*dt;player.yaw=normalize(player.yaw);shotFlash=Math.max(0,shotFlash-dt);damageFlash=Math.max(0,damageFlash-dt);hitMarker=Math.max(0,hitMarker-dt);for(const e of enemies)if(e.alive){const dist=Math.hypot(player.x-e.x,player.y-e.y),visible=lineClear(e.x,e.y);e.cooldown-=dt;if(visible&&dist<9&&e.cooldown<=.7)e.charge=Math.min(1,e.charge+dt/.7);else e.charge=Math.max(0,e.charge-dt*2);if(visible&&dist<9&&e.cooldown<=0){health-=10;e.cooldown=2.8+e.phase*.08;e.charge=0;damageFlash=.28;setMessage('IMPACT −10 ARMOUR — break line of sight!','danger');status();if(health<=0){finish(false);return}}}if(elapsed>feedbackUntil&&running){const target=aimedEnemy();setMessage(target?'TARGET LOCKED — fire now.':'Sweep the chamber. Walls block enemy fire.',target?'hit':'');feedbackUntil=elapsed+1.4}}
function projectEnemy(e,w,h){const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),angle=normalize(Math.atan2(dy,dx)-player.yaw);if(Math.abs(angle)>FOV*.62||d<.25||!lineClear(e.x,e.y))return null;if(rayDistance(player.yaw+angle,d+.2)<d-.18)return null;return{x:w/2+Math.tan(angle)*(w/2)/Math.tan(FOV/2),d,angle}}
function draw(){const w=canvas.width,h=canvas.height,horizon=h*.47,sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#09091c');sky.addColorStop(1,'#5a2958');g.fillStyle=sky;g.fillRect(0,0,w,horizon);g.fillStyle='#151326';g.fillRect(0,horizon,w,h-horizon);const cols=160,colW=w/cols;for(let i=0;i<cols;i++){const angle=player.yaw-FOV/2+i/cols*FOV,d=rayDistance(angle),correct=d*Math.cos(angle-player.yaw),wallH=Math.min(h*.94,h/correct*.78),top=horizon-wallH/2,stripe=(Math.floor((player.x+Math.cos(angle)*d)*2)+Math.floor((player.y+Math.sin(angle)*d)*2))%2;g.fillStyle=stripe?'#30405c':'#27334d';g.fillRect(i*colW,top,colW+1,wallH);g.fillStyle=`rgba(135,200,191,${Math.max(.06,.55-d*.025)})`;g.fillRect(i*colW,top,colW+1,2);g.fillStyle='rgba(8,8,20,.24)';g.fillRect(i*colW,top+wallH-4,colW+1,4)}g.strokeStyle='rgba(135,200,191,.22)';g.lineWidth=1;for(let y=0;y<5;y++){const yy=horizon+(h-horizon)*(1-Math.pow(.58,y+1));g.beginPath();g.moveTo(0,yy);g.lineTo(w,yy);g.stroke()}const visible=enemies.filter(e=>e.alive).map(e=>({e,p:projectEnemy(e,w,h)})).filter(o=>o.p).sort((a,b)=>b.p.d-a.p.d);for(const {e,p} of visible){const size=Math.max(25,Math.min(165,240/p.d)),cy=horizon+size*.08;g.save();g.translate(p.x,cy);g.shadowColor=e.charge>.35?'#fff':'#ef5e63';g.shadowBlur=10+e.charge*25;g.fillStyle=e.charge>.35?'#fff2dd':'#ef5e63';g.fillRect(-size*.25,-size*.42,size*.5,size*.58);g.fillStyle='#171713';g.fillRect(-size*.13,-size*.28,size*.08,size*.08);g.fillRect(size*.05,-size*.28,size*.08,size*.08);g.fillStyle='#87c8bf';g.fillRect(-size*.38,size*.02,size*.76,size*.12);g.fillStyle='#090914';g.fillRect(-size*.23,size*.2,size*.46,size*.055);g.fillStyle=e.hp===2?'#d7f64a':'#ef5e63';g.fillRect(-size*.23,size*.2,size*.23*e.hp,size*.055);g.restore()}const target=aimedEnemy();g.strokeStyle=hitMarker?'#fff':target?'#d7f64a':'#f9f2dd';g.lineWidth=3;g.beginPath();g.moveTo(w/2-15,h/2);g.lineTo(w/2-5,h/2);g.moveTo(w/2+5,h/2);g.lineTo(w/2+15,h/2);g.moveTo(w/2,h/2-15);g.lineTo(w/2,h/2-5);g.moveTo(w/2,h/2+5);g.lineTo(w/2,h/2+15);g.stroke();if(target){g.fillStyle='#d7f64a';g.font='800 13px ui-monospace,monospace';g.textAlign='center';g.fillText('LOCK',w/2,h/2+36)}g.fillStyle=shotFlash?'#fff8b6':'#32223e';g.beginPath();g.moveTo(w*.37,h);g.lineTo(w*.45,h*.78);g.lineTo(w*.55,h*.78);g.lineTo(w*.64,h);g.fill();if(damageFlash){g.fillStyle=`rgba(239,94,99,${damageFlash})`;g.fillRect(0,0,w,h)}if(shotFlash){g.fillStyle=`rgba(255,248,182,${shotFlash*2})`;g.fillRect(0,0,w,h)}}
function loop(now){if(!running)return;const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
function setAnalogue(e){const r=analogueEl.getBoundingClientRect(),radius=r.width/2,dx=e.clientX-(r.left+radius),dy=e.clientY-(r.top+radius),distance=Math.hypot(dx,dy),scale=distance>radius?radius/distance:1,nx=dx*scale/radius,ny=dy*scale/radius,dead=.16,magnitude=Math.hypot(nx,ny),strength=magnitude<=dead?0:(magnitude-dead)/(1-dead);analogue.x=strength?nx/magnitude*strength:0;analogue.y=strength?ny/magnitude*strength:0;analogueKnob.style.transform=`translate(calc(-50% + ${nx*radius*.56}px),calc(-50% + ${ny*radius*.56}px))`}
function releasePointer(id){if(analogue.pointerId===id){analogue.pointerId=null;analogue.x=analogue.y=0;analogueKnob.style.transform='translate(-50%,-50%)'}const button=actionPointers.get(id);if(button){button.classList.remove('active');actionPointers.delete(id)}if(touchStart?.id===id)touchStart=null}
function releaseAll(){keys.clear();analogue.pointerId=null;analogue.x=analogue.y=0;analogueKnob.style.transform='translate(-50%,-50%)';touchStart=null;for(const button of actionPointers.values())button.classList.remove('active');actionPointers.clear()}
addEventListener('keydown',e=>{mode(false);const k=e.key.toLowerCase();if([' ','enter'].includes(k)){e.preventDefault();overlay.hidden?primaryAction():start()}if(k==='b'&&!e.repeat)secondaryAction('keyboard');if(k==='r')start();if(running&&!e.repeat){if(k==='arrowdown'||k==='s')move(-.16);if(k==='arrowup'||k==='w')move(.16);if(k==='arrowleft'||k==='a')player.yaw-=.07;if(k==='arrowright'||k==='d')player.yaw+=.07;draw()}keys.add(k)});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});canvas.addEventListener('pointerdown',e=>{mode(e.pointerType==='touch');touchStart={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY};try{canvas.setPointerCapture?.(e.pointerId)}catch{}});canvas.addEventListener('pointermove',e=>{if(!touchStart||touchStart.id!==e.pointerId||!running)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.abs(dx)>3){player.yaw=normalize(player.yaw+dx*.0045);touchStart.x=e.clientX}if(Math.abs(dy)>5){move(-dy*.008);touchStart.y=e.clientY}});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{if(event==='pointerup'&&touchStart?.id===e.pointerId&&Math.hypot(e.clientX-touchStart.startX,e.clientY-touchStart.startY)<12)primaryAction();releasePointer(e.pointerId)});
analogueEl.addEventListener('pointerdown',e=>{e.preventDefault();mode(true);if(analogue.pointerId!==null)return;analogue.pointerId=e.pointerId;try{analogueEl.setPointerCapture?.(e.pointerId)}catch{}setAnalogue(e)});analogueEl.addEventListener('pointermove',e=>{if(analogue.pointerId===e.pointerId)setAnalogue(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])analogueEl.addEventListener(event,e=>releasePointer(e.pointerId));document.querySelectorAll('[data-action]').forEach(button=>{button.addEventListener('pointerdown',e=>{e.preventDefault();mode(true);actionPointers.set(e.pointerId,button);button.classList.add('active');try{button.setPointerCapture?.(e.pointerId)}catch{}button.dataset.action==='primary'?primaryAction():secondaryAction('touch')});for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>releasePointer(e.pointerId))});overlay.querySelector('button').onclick=start;
reset();outcome='ready';mode(matchMedia('(pointer:coarse)').matches);
</script></body></html>

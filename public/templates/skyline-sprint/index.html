<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Skyline Sprinter</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171326;color:#fffdf3;font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}body{display:grid;place-items:center}main{position:relative;width:min(100vw,760px);height:100dvh;max-height:900px;display:grid;grid-template-rows:auto minmax(0,1fr);background:#211b38;overflow:hidden}header{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:#171713;border-bottom:2px solid #d7f64a;font:800 12px ui-monospace,monospace}header b{color:#87c8bf;text-align:right}canvas{width:100%;height:100%;display:block;background:#f0876a;touch-action:none}.touch-gamepad{display:none;position:absolute;z-index:2;inset:auto max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));align-items:end;justify-content:space-between;pointer-events:none}.analogue{position:relative;width:clamp(108px,27vw,150px);aspect-ratio:1;border:2px solid rgba(215,246,74,.5);border-radius:50%;background:rgba(23,19,38,.24);box-shadow:inset 0 0 22px rgba(215,246,74,.12);pointer-events:auto;touch-action:none}.analogue-knob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,253,243,.58);background:rgba(215,246,74,.3);transform:translate(-50%,-50%)}.actions{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.game-action{min-width:56px;min-height:56px;border:2px solid rgba(255,253,243,.66);border-radius:50%;background:rgba(44,41,66,.55);color:#fff;font:900 18px ui-monospace,monospace;touch-action:none}.game-action.primary{width:clamp(76px,19vw,96px);height:clamp(76px,19vw,96px);border-color:rgba(215,246,74,.75);background:rgba(86,99,0,.52);color:#fffdf3}.game-action.active,.game-action:active{background:rgba(215,246,74,.75);color:#171713}.analogue:focus-visible,.game-action:focus-visible,#start button:focus-visible{outline:3px solid #87c8bf;outline-offset:3px}#start{position:absolute;inset:0;z-index:3;display:grid;place-content:center;gap:14px;padding:24px;background:linear-gradient(#211a39ed,#12111df4);text-align:center}#start[hidden]{display:none}h1{margin:0;color:#d7f64a;font-size:clamp(42px,14vw,78px);line-height:.85;text-transform:uppercase;text-shadow:5px 5px #71425d}#start p{max-width:35ch;margin:0 auto;line-height:1.45}#controls{color:#87c8bf;font:700 11px ui-monospace,monospace}#start button{min-height:54px;border:0;background:#d7f64a;color:#171713;font-weight:950;font-size:18px;box-shadow:6px 6px #566300}@media(pointer:coarse){.touch-gamepad{display:flex}}@media(pointer:fine){.touch-gamepad{display:none}}@media(pointer:coarse) and (max-height:500px){.touch-gamepad{bottom:max(6px,env(safe-area-inset-bottom))}.analogue{width:96px}.game-action.primary{width:72px;height:72px}.game-action{min-width:48px;min-height:48px}header{padding-block:5px;font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><span id="s">Cells 0/5 · Hearts 3</span><b id="goal">RUN · JUMP · POWER THE BEACON</b></header><canvas id="c" width="720" height="640" aria-label="Side-view sunset platform course"></canvas><div class="touch-gamepad" aria-label="Touch game controls"><div class="analogue" role="group" tabindex="0" aria-label="Run analogue pad"><span class="analogue-knob" aria-hidden="true"></span></div><div class="actions"><button type="button" class="game-action secondary" data-action="secondary" aria-label="Secondary action, reserved">B</button><button type="button" class="game-action primary" data-action="primary" aria-label="Jump">JUMP</button></div></div><section id="start"><h1>Skyline<br>Sprinter</h1><p id="intro">Collect five power cells, clear the spark gaps, and reach the launch beacon.</p><p id="controls">Left pad runs · JUMP or Space jumps · B secondary</p><button type="button">START RUN</button></section></main><script>
const canvas=document.querySelector('#c'),g=canvas.getContext('2d'),overlay=document.querySelector('#start'),statusEl=document.querySelector('#s'),legend=document.querySelector('#controls'),goal=document.querySelector('#goal'),intro=document.querySelector('#intro'),touchGamepad=document.querySelector('.touch-gamepad');
const START={x:42,y:500},MAX_SPEED=245,ACCEL=1250,BRAKE=1750,GRAVITY=1550;
let player={x:START.x,y:START.y,vx:0,vy:0},running=false,outcome='ready',last=0,hearts=3,collected=0,keys=new Set(),touchStart=null,dash={direction:0,until:0},invuln=0,camera=0,checkpoint={...START},inputMode=null,secondaryActions=0;
const analogue={pointerId:null,x:0,y:0},analogueEl=document.querySelector('.analogue'),analogueKnob=document.querySelector('.analogue-knob'),actionPointers=new Map();
const platforms=[[0,560,320,80],[390,500,170,24],[635,425,145,24],[855,535,210,105],[1130,455,155,24],[1355,365,145,24],[1580,485,180,24],[1840,395,155,24],[2070,515,190,125],[2350,455,250,185]];
const cells=[[475,460],[705,385],[1210,415],[1430,325],[1920,355]],hazards=[[322,560,66],[565,560,68],[785,560,68],[1068,560,60],[1288,560,65],[1505,560,72],[1765,560,72],[2000,560,67],[2262,560,86]];
function mode(touch){const next=touch?'touch':'keyboard';if(inputMode&&inputMode!==next&&running)clearInput();inputMode=next;legend.textContent=touch?'Left pad runs · JUMP or Space jumps · B secondary':'A/D or arrows run · W/Space jumps · B secondary';}
function clearInput(){keys.clear();touchStart=null;dash.direction=0;dash.until=0;player.vx=0;analogue.pointerId=null;analogue.x=analogue.y=0;analogueKnob.style.transform='translate(-50%,-50%)';for(const button of actionPointers.values())button.classList.remove('active');actionPointers.clear()}
function reset(){clearInput();player.x=START.x;player.y=START.y;player.vx=0;player.vy=0;hearts=3;collected=0;invuln=0;camera=0;checkpoint={...START};cells.forEach(c=>c[2]=false);status();draw()}
function status(){statusEl.textContent=`Cells ${collected}/5 · Hearts ${hearts}`}
function start(){reset();running=true;outcome='playing';overlay.hidden=true;goal.textContent='RUN · JUMP · POWER THE BEACON';last=performance.now();requestAnimationFrame(loop)}
function finish(win){clearInput();running=false;outcome=win?'won':'lost';overlay.hidden=false;overlay.querySelector('h1').innerHTML=win?'Beacon<br>Online':'Run<br>Over';intro.textContent=win?'You powered every relay and reached the launch beacon!':'The sparks got you. Release, reset, and time each jump.';overlay.querySelector('button').textContent='RUN AGAIN';goal.textContent=win?'CITY POWERED':'TRY AGAIN';draw()}
function grounded(){return platforms.some(p=>player.x+28>p[0]&&player.x<p[0]+p[2]&&Math.abs(player.y+40-p[1])<8)}
function jump(){if(running&&grounded())player.vy=-610}
function primaryAction(){jump()}function secondaryAction(source='touch'){secondaryActions++;dispatchEvent(new CustomEvent('game:secondary-action',{detail:{source,count:secondaryActions}}))}
function desiredDirection(now){const keyboard=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);if(keyboard)return keyboard;if(Math.abs(analogue.x)>.001)return analogue.x;return dash.until>now?dash.direction:0}
function approach(value,target,amount){return value<target?Math.min(target,value+amount):Math.max(target,value-amount)}
function respawn(){clearInput();player.x=checkpoint.x;player.y=checkpoint.y;player.vy=0;camera=Math.max(0,Math.min(1880,player.x-180));invuln=1.1}
function hurt(){if(invuln>0||!running)return;hearts--;status();if(!hearts)finish(false);else respawn()}
function update(dt,now){const direction=desiredDirection(now),target=direction*MAX_SPEED;player.vx=approach(player.vx,target,(direction?ACCEL:BRAKE)*dt);if(!direction&&Math.abs(player.vx)<2)player.vx=0;const oldBottom=player.y+40;player.vy+=GRAVITY*dt;player.x=Math.max(0,Math.min(2565,player.x+player.vx*dt));player.y+=player.vy*dt;for(const p of platforms){if(player.x+28>p[0]&&player.x<p[0]+p[2]&&oldBottom<=p[1]+5&&player.y+40>=p[1]&&player.vy>=0){player.y=p[1]-40;player.vy=0}}for(const c of cells)if(!c[2]&&Math.hypot(player.x+14-c[0],player.y+18-c[1])<36){c[2]=true;collected++;checkpoint={x:Math.max(10,player.x-35),y:player.y};status()}invuln=Math.max(0,invuln-dt);for(const h of hazards)if(player.x+25>h[0]&&player.x<h[0]+h[2]&&player.y+40>520)hurt();if(player.y>690)hurt();if(player.x>2455){if(collected===5)finish(true);else{goal.textContent=`BEACON NEEDS ${5-collected} CELL${collected===4?'':'S'}`;player.x=2420;player.vx=Math.min(0,player.vx)}}else if(running)goal.textContent='RUN · JUMP · POWER THE BEACON';camera+=(Math.max(0,Math.min(1880,player.x-180))-camera)*Math.min(1,dt*6)}
function playfieldRise(){if(getComputedStyle(touchGamepad).display==='none')return 0;const canvasRect=canvas.getBoundingClientRect(),controlsRect=touchGamepad.getBoundingClientRect();if(!canvasRect.height)return 0;const controlsTop=(controlsRect.top-canvasRect.top-56)*canvas.height/canvasRect.height;return Math.max(0,Math.min(220,560-controlsTop))}
function draw(){const w=canvas.width,h=canvas.height,rise=playfieldRise(),grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#765b91');grad.addColorStop(.55,'#f0876a');grad.addColorStop(1,'#ffd082');g.fillStyle=grad;g.fillRect(0,0,w,h);g.fillStyle='#ffd979';g.beginPath();g.arc(w-100-camera*.05,110,50,0,Math.PI*2);g.fill();g.fillStyle='#433656';for(let i=0;i<14;i++){const x=i*110-(camera*.18%110);g.fillRect(x,h-180-rise-(i%3)*35,75,220+rise)}g.save();g.translate(-camera,-rise);for(const p of platforms){g.fillStyle='#242339';g.fillRect(...p);g.fillStyle='#87c8bf';g.fillRect(p[0],p[1],p[2],8)}for(const hzd of hazards){g.fillStyle='#ef5e63';for(let x=hzd[0];x<hzd[0]+hzd[2];x+=14){g.beginPath();g.moveTo(x,560);g.lineTo(x+7,526);g.lineTo(x+14,560);g.fill()}}for(const c of cells)if(!c[2]){g.fillStyle='#d7f64a';g.shadowColor='#d7f64a';g.shadowBlur=18;g.fillRect(c[0]-10,c[1]-15,20,30);g.shadowBlur=0}g.fillStyle='#f9f2dd';g.fillRect(2480,295,14,160);g.fillStyle=collected===5?'#d7f64a':'#5d5b52';g.shadowColor=g.fillStyle;g.shadowBlur=22;g.beginPath();g.moveTo(2487,280);g.lineTo(2442,325);g.lineTo(2532,325);g.fill();g.shadowBlur=0;if(!(invuln&&Math.floor(invuln*10)%2)){g.fillStyle='#d7f64a';g.fillRect(player.x,player.y,28,40);g.fillStyle='#171713';g.fillRect(player.x+17,player.y+9,6,6);g.fillStyle='#ff8a3d';g.fillRect(player.x-7,player.y+18,12,9)}g.restore()}
function loop(now){if(!running)return;const dt=Math.min(.035,(now-last)/1000);last=now;update(dt,now);draw();if(running)requestAnimationFrame(loop)}
function releasePointer(id){if(analogue.pointerId===id){analogue.pointerId=null;analogue.x=analogue.y=0;analogueKnob.style.transform='translate(-50%,-50%)';if(!keys.size){player.vx=0;dash.direction=0;dash.until=0}}const button=actionPointers.get(id);if(button){button.classList.remove('active');actionPointers.delete(id)}if(touchStart?.id===id)touchStart=null}
function releaseAll(){clearInput()}
addEventListener('keydown',e=>{mode(false);const k=e.key.toLowerCase();if(k==='enter'&&!running)start();if(k==='r')start();if(k===' '||k==='w'||k==='arrowup'){e.preventDefault();overlay.hidden?primaryAction():start()}if(k==='b'&&!e.repeat)secondaryAction('keyboard');if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){keys.add(k);if(!e.repeat){const direction=k==='arrowleft'||k==='a'?-1:1;player.vx=approach(player.vx,direction*MAX_SPEED,90);player.x=Math.max(0,Math.min(2565,player.x+direction*2))}}});
addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(!keys.size&&analogue.pointerId===null)player.vx=0});addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
canvas.addEventListener('pointerdown',e=>{mode(e.pointerType==='touch');touchStart={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!touchStart||touchStart.id!==e.pointerId||!running)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.abs(dx)>24){const direction=Math.sign(dx);dash={direction,until:performance.now()+140};player.vx=direction*90;player.x=Math.max(0,Math.min(2565,player.x+direction*2));touchStart.x=e.clientX}if(dy<-28){jump();touchStart.y=e.clientY}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>releasePointer(e.pointerId));
function setAnalogue(e){const r=analogueEl.getBoundingClientRect(),radius=r.width/2,dx=e.clientX-(r.left+radius),dy=e.clientY-(r.top+radius),distance=Math.hypot(dx,dy),scale=distance>radius?radius/distance:1,nx=dx*scale/radius,ny=dy*scale/radius,dead=.16,magnitude=Math.hypot(nx,ny),strength=magnitude<=dead?0:(magnitude-dead)/(1-dead);analogue.x=strength?nx/magnitude*strength:0;analogue.y=strength?ny/magnitude*strength:0;analogueKnob.style.transform=`translate(calc(-50% + ${nx*radius*.56}px),calc(-50% + ${ny*radius*.56}px))`}
analogueEl.addEventListener('pointerdown',e=>{e.preventDefault();mode(true);if(analogue.pointerId!==null)return;analogue.pointerId=e.pointerId;try{analogueEl.setPointerCapture?.(e.pointerId)}catch{}setAnalogue(e)});analogueEl.addEventListener('pointermove',e=>{if(analogue.pointerId===e.pointerId)setAnalogue(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])analogueEl.addEventListener(event,e=>releasePointer(e.pointerId));document.querySelectorAll('[data-action]').forEach(button=>{button.addEventListener('pointerdown',e=>{e.preventDefault();mode(true);actionPointers.set(e.pointerId,button);button.classList.add('active');try{button.setPointerCapture?.(e.pointerId)}catch{}button.dataset.action==='primary'?primaryAction():secondaryAction('touch')});for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,e=>releasePointer(e.pointerId))});
addEventListener('pointerup',e=>releasePointer(e.pointerId),true);addEventListener('pointercancel',e=>releasePointer(e.pointerId),true);overlay.addEventListener('pointerdown',releaseAll);overlay.querySelector('button').onclick=start;reset();mode(matchMedia('(pointer:coarse)').matches);
</script></body></html>

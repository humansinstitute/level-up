<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Trail</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#090b18;color:#f8edcf;font:700 16px system-ui;touch-action:manipulation;user-select:none;-webkit-user-select:none}main{position:relative;width:min(94vw,450px);text-align:center}h1{margin:.4rem 0;font-size:clamp(1.5rem,8vw,2rem)}canvas{display:block;width:100%;aspect-ratio:1;border:5px solid #6be3ff;background:#111329;image-rendering:pixelated;touch-action:pan-y}.pad{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px}.pad button{min-width:44px;min-height:44px;border:0;padding:14px;background:#d7f64a;font-weight:900}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}.overlay{position:absolute;inset:3.2rem 5px auto;min-height:min(76vw,340px);display:grid;place-content:center;gap:12px;padding:24px;background:#090b18ef;border:3px solid #6be3ff}.overlay[hidden]{display:none}.overlay h2,.overlay p{margin:0}.overlay p{line-height:1.45}.overlay button{min-height:52px;padding:12px 20px;border:0;background:#d7f64a;color:#171713;font-weight:900}</style></head><body><main><h1>NEON TRAIL</h1><canvas width="400" height="400" aria-label="Neon Trail game"></canvas><section class="overlay" id="start"><h2>LIGHT THE TRAIL</h2><p id="controls"></p><button type="button">START GAME</button></section><p id="s" aria-live="polite">Score: 0</p><div class="pad" aria-label="Direction controls"><button data-d="0,-1" aria-label="Up">▲</button><button data-d="-1,0" aria-label="Left">◀</button><button data-d="0,1" aria-label="Down">▼</button><button data-d="1,0" aria-label="Right">▶</button></div></main><script>// Adapted into Level Up from source game: snake.
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),startOverlay=document.querySelector('#start'),controls=document.querySelector('#controls'),z=20;let snake=[[10,10],[9,10],[8,10]],dir=[1,0],food=[15,10],score=0,timer=0,inputMode=matchMedia('(hover:hover) and (pointer:fine)').matches?'keyboard':'touch';function legend(){controls.textContent=inputMode==='touch'?'Swipe the trail to turn. Tap Start to begin.':'Arrow keys or WASD turn. Space starts; R restarts.'}legend();function start(){snake=[[10,10],[9,10],[8,10]];dir=[1,0];food=[15,10];score=0;s.textContent='Score: 0';startOverlay.hidden=true;clearInterval(timer);timer=setInterval(step,115);draw()}function place(){for(let attempts=0;attempts<400;attempts++){const next=[Math.random()*20|0,Math.random()*20|0];if(!snake.some(q=>q+''===next+'')){food=next;return}}for(let y=0;y<20;y++)for(let x=0;x<20;x++)if(!snake.some(q=>q+''===[x,y]+'')){food=[x,y];return}}function step(){let h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(h.some(v=>v<0||v>=20)||snake.some(q=>q+''===h+'')){s.textContent=`CRASH! Score ${score} — press R or swipe to restart`;clearInterval(timer);timer=0;return}snake.unshift(h);if(h+''===food+''){score++;s.textContent=`Score: ${score}`;place()}else snake.pop();draw()}function draw(){g.fillStyle='#111329';g.fillRect(0,0,400,400);g.fillStyle='#ff8a3d';g.fillRect(food[0]*z+3,food[1]*z+3,14,14);snake.forEach((q,i)=>{g.fillStyle=i?'#d7f64a':'#6be3ff';g.fillRect(q[0]*z+1,q[1]*z+1,18,18)})}function turn(a,b){if(!timer){start();return}if(a===-dir[0]&&b===-dir[1])return;dir=[a,b]}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(...b.dataset.d.split(',').map(Number)));startOverlay.querySelector('button').onclick=start;addEventListener('keydown',e=>{inputMode='keyboard';legend();let d={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];if(d){e.preventDefault();turn(...d)}else if(e.key===' '&&!timer){e.preventDefault();start()}else if(e.key==='r'||e.key==='R')start()});let gesture=null;c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;inputMode='touch';legend();gesture={id:e.pointerId,x:e.clientX,y:e.clientY};c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(gesture&&e.pointerId===gesture.id)e.preventDefault()},{passive:false});c.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;turn(...(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]))});c.addEventListener('pointercancel',()=>gesture=null);draw();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pocket Pong</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#171713;color:#f8edcf;font:700 16px system-ui;touch-action:manipulation;user-select:none;-webkit-user-select:none}main{position:relative;width:min(94vw,440px);text-align:center}h1{margin:.4rem 0;font-size:clamp(1.5rem,8vw,2rem)}canvas{display:block;width:100%;height:min(120vw,560px);max-height:72dvh;border:5px solid #ff8a3d;background:#1e1e29;touch-action:pan-y}p{color:#d7f64a}.overlay{position:absolute;inset:3.2rem 5px auto;min-height:min(100vw,430px);display:grid;place-content:center;gap:12px;padding:24px;background:#171713ef;border:3px solid #ff8a3d}.overlay[hidden]{display:none}.overlay h2,.overlay p{margin:0}.overlay p{line-height:1.45;color:#f8edcf}.overlay button{min-height:52px;padding:12px 20px;border:0;background:#ff8a3d;color:#171713;font-weight:900}</style></head><body><main><h1>POCKET PONG</h1><canvas width="420" height="560" aria-label="Pocket Pong game"></canvas><section class="overlay" id="start"><h2>DEFEND THE BOTTOM</h2><p id="controls"></p><button type="button">START GAME</button></section><p id="s" aria-live="polite">First to 5.</p></main><script>// Adapted into Level Up from source game: pong.
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s'),startOverlay=document.querySelector('#start'),controls=document.querySelector('#controls');let px=160,ai=160,b={x:210,y:280,vx:3.2,vy:4},you=0,cpu=0,running=false,inputMode=matchMedia('(hover:hover) and (pointer:fine)').matches?'keyboard':'touch';function legend(){controls.textContent=inputMode==='touch'?'Swipe left and right on the court. Tap Start to serve.':'Left/Right or A/D move. Space serves; R restarts.'}legend();function reset(v=1){px=160;ai=160;you=cpu=0;b={x:210,y:280,vx:(Math.random()>.5?1:-1)*3.2,vy:v*4};running=true;startOverlay.hidden=true;s.textContent='First to 5.'}function moveTo(clientX){let r=c.getBoundingClientRect(),x=(clientX-r.left)*420/r.width;px=Math.max(0,Math.min(320,x-50))}function shift(dx){px=Math.max(0,Math.min(320,px+dx))}startOverlay.querySelector('button').onclick=()=>reset();addEventListener('keydown',e=>{inputMode='keyboard';legend();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();shift(-28)}else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();shift(28)}else if((e.key===' '||e.key==='Enter')&&!running){e.preventDefault();reset()}else if(e.key==='r'||e.key==='R')reset()});let gesture=null;c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;inputMode='touch';legend();gesture={id:e.pointerId,x:e.clientX,y:e.clientY};c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.id)return;e.preventDefault();if(Math.abs(e.clientX-gesture.x)>=8)moveTo(e.clientX)},{passive:false});c.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.id)return;let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(!running)reset();else if(Math.abs(dx)>Math.abs(dy))shift(Math.sign(dx)*42)});c.addEventListener('pointercancel',()=>gesture=null);function loop(){if(running){b.x+=b.vx;b.y+=b.vy;if(b.x<9||b.x>411)b.vx*=-1;ai+=Math.sign(b.x-(ai+50))*2.1;if(b.y<42&&b.y>20&&b.x>ai&&b.x<ai+100)b.vy=Math.abs(b.vy);if(b.y>518&&b.y<542&&b.x>px&&b.x<px+100)b.vy=-Math.abs(b.vy);if(b.y<0){you++;b={x:210,y:280,vx:(Math.random()>.5?1:-1)*3.2,vy:4}}if(b.y>560){cpu++;b={x:210,y:280,vx:(Math.random()>.5?1:-1)*3.2,vy:-4}}if(you===5||cpu===5){s.textContent=you===5?'YOU WIN! Press R or swipe to replay.':'CPU WINS — press R or swipe to retry.';running=false}}g.fillStyle='#1e1e29';g.fillRect(0,0,420,560);g.setLineDash([12,12]);g.strokeStyle='#666';g.beginPath();g.moveTo(0,280);g.lineTo(420,280);g.stroke();g.setLineDash([]);g.fillStyle='#ff8a3d';g.fillRect(ai,24,100,16);g.fillStyle='#d7f64a';g.fillRect(px,520,100,16);g.fillStyle='#f8edcf';g.fillRect(b.x-8,b.y-8,16,16);g.font='bold 28px system-ui';g.fillText(`${cpu} : ${you}`,180,295);requestAnimationFrame(loop)}loop();</script></body></html>

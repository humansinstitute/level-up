<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arcade Cabinet — Snake, Minotaur Maze & Tennis</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d22;color:#f7f1d0;font:700 14px system-ui;min-height:100dvh;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}.cab{width:min(100%,720px);padding:10px;text-align:center}h1{color:#ffcf45;text-shadow:3px 3px #d13d72;font-size:clamp(26px,8vw,52px);margin:5px}.menu{display:grid;gap:12px;margin:22px auto;max-width:500px}.menu button,.actions button,.start button{min-height:48px;border:3px solid #ffcf45;background:#30235f;color:#fff;padding:10px;font-weight:900;font-size:16px}.menu button:nth-child(2){border-color:#65e0a5}.menu button:nth-child(3){border-color:#e85f91}.screen{display:none}.screen.active{display:block}canvas{display:block;width:100%;aspect-ratio:4/3;max-height:70dvh;border:5px solid #5c4a9d;background:#090817;image-rendering:pixelated;touch-action:none}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:8px;align-items:center}.actions span{font:700 12px monospace;text-align:left}.start{position:fixed;inset:0;background:#090817eF;display:grid;place-items:center;padding:20px}.start>div{max-width:420px;border:5px solid #ffcf45;background:#30235f;padding:22px}.hidden{display:none!important}
</style></head><body><main class="cab"><section id="menu"><h1>ARCADE CABINET</h1><p>Three games. One package. Pick your challenge.</p><div class="menu"><button data-game="snake">SNAKE</button><button data-game="maze">MINOTAUR MAZE</button><button data-game="tennis">TENNIS</button></div><small>Keyboard and phone-friendly · Offline play</small></section><section class="screen" id="screen"><h2 id="title"></h2><div id="s">Score 0</div><canvas width="640" height="480"></canvas><div class="actions"><span id="controls">Arrow keys move · R restarts</span><button id="back">← Cabinet</button><button id="restart">Restart</button></div></section></main><div class="start hidden" id="start"><div><h2 id="start-title"></h2><p id="help"></p><button>START GAME</button></div></div><script>
const C=document.querySelector('canvas'),g=C.getContext('2d'),menu=document.querySelector('#menu'),screen=document.querySelector('#screen'),overlay=document.querySelector('#start'),scoreEl=document.querySelector('#s'),controls=document.querySelector('#controls');let game='',running=false,timer=0,state,touch=null,tennisDirection=0,tennisFrameTime=performance.now();
const maze=["################","#..............#","#.####.##.####.#","#......##......#","#.##.#....#.##.#","#....#.##.#....#","####.#.##.#.####","#..............#","#.####.##.####.#","#..............#","################"];
function choose(name){game=name;menu.style.display='none';screen.classList.add('active');document.querySelector('#title').textContent=name==='snake'?'Snake':name==='maze'?'Minotaur Maze':'Tennis';document.querySelector('#start-title').textContent=document.querySelector('#title').textContent;document.querySelector('#help').textContent=name==='snake'?'Collect sparks, wrap across the edges, and avoid your trail. Press Space or tap to start.':name==='maze'?'Choose a direction and keep moving until a wall. Press Space or tap to start.':'Hold the left or right half to move. Press Space or tap to start.';controls.textContent=name==='tennis'?'Arrow keys or hold either half · Space starts':name==='maze'?'Arrow keys or swipe choose direction · Space starts':'Arrow keys turn · Space starts';overlay.classList.remove('hidden');reset(false)}
function reset(play=true){clearInterval(timer);running=play;tennisDirection=0;tennisFrameTime=performance.now();touch=null;if(game==='snake'){state={body:[[8,6],[7,6]],dir:[1,0],food:[12,6],score:0};if(play)timer=setInterval(stepSnake,135)}else if(game==='maze'){state={p:[1,1],m:[14,9],dots:new Set(),score:0,dir:[0,0]};maze.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='.')state.dots.add(x+','+y)}));if(play)timer=setInterval(stepMaze,360)}else state={px:270,ai:270,bx:320,by:240,vx:5,vy:3,score:0,aiScore:0};draw()}
function stepSnake(){let h=state.body[0],n=[(h[0]+state.dir[0]+20)%20,(h[1]+state.dir[1]+15)%15];if(state.body.some(p=>p[0]===n[0]&&p[1]===n[1]))return reset(true);state.body.unshift(n);if(n[0]===state.food[0]&&n[1]===state.food[1]){state.score++;state.food=[(n[0]*7+5)%20,(n[1]*5+3)%15]}else state.body.pop();draw()}
function open(x,y){return maze[y]?.[x]&&maze[y][x]!=='#'}function stepMaze(){let [px,py]=state.p,[dx,dy]=state.dir,n=[px+dx,py+dy];if((dx||dy)&&open(...n)){state.p=n;let key=n+'';if(state.dots.delete(key))state.score++;if(state.m+''===key||!state.dots.size)return reset(true)}[px,py]=state.p;let [mx,my]=state.m,opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(d=>open(mx+d[0],my+d[1])).sort((a,b)=>Math.hypot(mx+a[0]-px,my+a[1]-py)-Math.hypot(mx+b[0]-px,my+b[1]-py));if(opts[0])state.m=[mx+opts[0][0],my+opts[0][1]];if(state.m+''===state.p+'')return reset(true);draw()}
function move(dx,dy){if(!running)return;if(game==='snake'){if(state.dir[0]!==-dx||state.dir[1]!==-dy)state.dir=[dx,dy]}else if(game==='maze')state.dir=[dx,dy]}
function draw(){g.fillStyle='#090817';g.fillRect(0,0,640,480);if(game==='snake'){g.fillStyle='#ffcf45';g.fillRect(state.food[0]*32+8,state.food[1]*32+8,16,16);g.fillStyle='#65e0a5';state.body.forEach(p=>g.fillRect(p[0]*32+2,p[1]*32+2,28,28));scoreEl.textContent=`Score ${state.score}`}else if(game==='maze'){let w=40,h=43.6;maze.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='#'){g.fillStyle='#30235f';g.fillRect(x*w,y*h,w,h)}else if(state.dots.has(x+','+y)){g.fillStyle='#ffcf45';g.beginPath();g.arc(x*w+20,y*h+22,4,0,7);g.fill()}}));g.fillStyle='#ffcf45';g.beginPath();g.arc(state.p[0]*w+20,state.p[1]*h+22,15,.2,6.1);g.fill();g.fillStyle='#e85f91';g.fillRect(state.m[0]*w+6,state.m[1]*h+8,28,28);scoreEl.textContent=`Crumbs ${state.score}`}else{g.setLineDash([10,10]);g.strokeStyle='#574b82';g.beginPath();g.moveTo(320,0);g.lineTo(320,480);g.stroke();g.setLineDash([]);g.fillStyle='#65e0a5';g.fillRect(state.px,442,100,15);g.fillStyle='#e85f91';g.fillRect(state.ai,23,100,15);g.fillStyle='#ffcf45';g.beginPath();g.arc(state.bx,state.by,10,0,7);g.fill();scoreEl.textContent=`You ${state.score} · ${state.aiScore} Cabinet`}}
function frame(now){if(game==='tennis'&&running){let elapsed=now-tennisFrameTime;tennisFrameTime=now;state.px=Math.max(0,Math.min(540,state.px+tennisDirection*.85*elapsed));state.bx+=state.vx;state.by+=state.vy;state.ai+=(state.bx-state.ai-50)*.04;if(state.bx<10||state.bx>630)state.vx*=-1;if(state.by>432&&state.by<462&&state.bx>state.px&&state.bx<state.px+100)state.vy=-Math.abs(state.vy);if(state.by<48&&state.bx>state.ai&&state.bx<state.ai+100)state.vy=Math.abs(state.vy);if(state.by>490){state.aiScore++;state.bx=320;state.by=240}if(state.by<0){state.score++;state.bx=320;state.by=240}draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>choose(b.dataset.game));function startGame(){if(overlay.classList.contains('hidden'))return;overlay.classList.add('hidden');reset(true)}overlay.querySelector('button').onclick=startGame;overlay.addEventListener('pointerup',e=>{if(e.pointerType==='touch')startGame()});document.querySelector('#restart').onclick=()=>reset(true);document.querySelector('#back').onclick=()=>{clearInterval(timer);running=false;tennisDirection=0;screen.classList.remove('active');menu.style.display='block'};addEventListener('keydown',e=>{controls.textContent=game==='tennis'?'Hold ← or → · Space starts · R restarts':game==='maze'?'Arrows choose direction · Space starts · R restarts':'Arrow keys turn · Space starts · R restarts';if(!running&&(e.key==='Enter'||e.key===' '))startGame();if(e.key.toLowerCase()==='r')reset(true);if(e.key==='Backspace')document.querySelector('#back').click();let d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();if(game==='tennis')tennisDirection=d[0];else move(...d)}});addEventListener('keyup',e=>{if(game==='tennis'&&((e.key==='ArrowLeft'&&tennisDirection<0)||(e.key==='ArrowRight'&&tennisDirection>0)))tennisDirection=0});C.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY];C.setPointerCapture?.(e.pointerId);if(game==='tennis'&&running){let box=C.getBoundingClientRect();tennisDirection=e.clientX<box.left+box.width/2?-1:1;controls.textContent='Keep holding to move · Release to stop'}else controls.textContent='Swipe to choose direction · Restart or return below'});function releaseTouch(e){if(game==='tennis'){tennisDirection=0;touch=null;return}if(!touch)return;let dx=e.clientX-touch[0],dy=e.clientY-touch[1];touch=null;if(Math.abs(dx)<8&&Math.abs(dy)<8)return;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy))}C.addEventListener('pointerup',releaseTouch);C.addEventListener('pointercancel',releaseTouch);
</script></body></html>
